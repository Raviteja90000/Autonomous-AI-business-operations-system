version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_ops_postgres
    environment:
      POSTGRES_USER: ai_ops_user
      POSTGRES_PASSWORD: ai_ops_password
      POSTGRES_DB: ai_ops_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_ops_user -d ai_ops_manager"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_ops_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: ai_ops_backend
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://ai_ops_user:ai_ops_password@postgres:5432/ai_ops_manager
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=enterprise-secret-key-change-in-production-super-secure
      - JWT_SECRET=enterprise-secret-key-change-in-production-super-secure
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: ai_ops_worker
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://ai_ops_user:ai_ops_password@postgres:5432/ai_ops_manager
      - REDIS_URL=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: ai_ops_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: ai_ops_otel_collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ../monitoring/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: ai_ops_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

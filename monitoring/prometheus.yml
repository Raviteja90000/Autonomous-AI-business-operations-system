global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ai-ops-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'autonomous-ops-backend'
          env: 'production'

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
